[project]
name = "MiniIDE"
description = "API and implementation reference for the native MiniLang IDE, including editing, project management, builds, language services, diagnostics, Markdown help, theming, and assistant integration."
entry = "src/main.ml"
source_roots = ["src"]
include = ["src"]
exclude = ["build", "docs/api", "examples", "projects", "tests"]
target = "windows-x64"

[documentation]
include_internal = true
reachable_only = false
strict = true
dependencies = "summary"
contract_warnings = "public"
summary_quality_warnings = "public"
duplicate_summary_threshold = 3
page_granularity = "container"

[output]
formats = ["html", "markdown"]
html_dir = "docs/api/html"
markdown_dir = "docs/api/markdown"
markdown_profile = "repository"
include_timestamp = false

[graphs]
imports = true
calls = true
types = true
format = "svg"
max_nodes = 300
granularity = "package"
hide_empty = true

[links]
repository = "https://github.com/MiniLangProject/MiniIDE"
ref = "main"
